name: Render mesoscale models (HRRR, NAM, NBM) and deploy

on:
  schedule:
    # Poll every 30 min; the check job exits fast when nothing new is out.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render even if the runs are already live"
        type: boolean
        default: false
      hours:
        description: "Forecast hours, e.g. 0-120/6 (blank = each model's full range)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: false

env:
  WX_MODELS: hrrr namnest nam nbm
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_render: ${{ steps.check.outputs.needs_render }}
      jobs: ${{ steps.check.outputs.jobs }}
      runs: ${{ steps.check.outputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy ecmwf-opendata
      - id: check
        env:
          HOURS: ${{ github.event.inputs.hours }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS="--chunks 5"
          if [ -n "$HOURS" ]; then ARGS="$ARGS --hours $HOURS"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python render/check_multi.py $ARGS

  render:
    needs: check
    if: needs.check.outputs.needs_render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.check.outputs.jobs) }}
    env:
      WX_MODEL: ${{ matrix.model }}
      WX_MANIFEST: ${{ matrix.manifest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (eccodes for GRIB, GEOS/PROJ for cartopy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libgeos-dev libproj-dev
      - run: pip install -r requirements.txt
      - name: Cache Natural Earth shapefiles
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: natural-earth-50m-v1
      - name: Render ${{ matrix.model }} hours ${{ matrix.chunk }}
        run: python render/render.py --run ${{ matrix.run }} --hours "${{ matrix.chunk }}" --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.model }}-${{ strategy.job-index }}
          path: site/images
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: [check, render]
    # run even if some slices failed: the manifest only lists hours that have images
    if: always() && needs.check.outputs.needs_render == 'true' && needs.render.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libgeos-dev libproj-dev
      - run: pip install -r requirements.txt
      - name: Collect rendered slices
        uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: site/images
          merge-multiple: true
        continue-on-error: true
      - name: Write manifests
        env:
          RUNS: ${{ needs.check.outputs.runs }}
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          for m in $WX_MODELS; do
            run=$(echo "$RUNS" | jq -r --arg m "$m" '.[$m] // empty')
            if [ -z "$run" ]; then echo "no run for $m"; continue; fi
            ARGS="--manifest-only --run $run"
            if [ -n "$HOURS" ]; then ARGS="$ARGS --hours $HOURS"; fi
            WX_MODEL=$m WX_MANIFEST=manifest-$m.json python render/render.py $ARGS
          done
          find site/images -name '*.png' | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
